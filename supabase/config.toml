project_id = "homehub"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = false
enable_anonymous_sign_ins = false
jwt_expiry = 3600

[auth.email]
enable_signup = false
enable_confirmations = false
secure_password_change = true
